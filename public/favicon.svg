<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="yjFavBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c8cff" />
      <stop offset="50%" stop-color="#8cd8ff" />
      <stop offset="100%" stop-color="#78e6bc" />
    </linearGradient>
    <linearGradient id="yjFavGradY" x1="25%" y1="25%" x2="50%" y2="55%">
      <stop offset="0%" stop-color="#b8a8ff" />
      <stop offset="100%" stop-color="#7c8cff" />
    </linearGradient>
    <linearGradient id="yjFavGradJ" x1="75%" y1="25%" x2="20%" y2="85%">
      <stop offset="0%" stop-color="#8cd8ff" />
      <stop offset="50%" stop-color="#7c8cff" />
      <stop offset="100%" stop-color="#78e6bc" />
    </linearGradient>
    <linearGradient id="yjFavBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1424" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>
  </defs>

  <!-- Modern Rounded Squircle Frame -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#yjFavBg)" stroke="url(#yjFavBorder)" stroke-width="3.2" />

  <!-- Cyber Tech Brackets -->
  <path d="M15 28 V15 H28" stroke="#8cd8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  <path d="M85 72 V85 H72" stroke="#78e6bc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

  <!-- Y-Wing (Left) meeting cleanly at nexus (50, 52) -->
  <path d="M26 26 L50 52" stroke="url(#yjFavGradY)" stroke-width="9" stroke-linecap="round" />

  <!-- Interlocking Y-Right-Wing + J Stem & Hook meeting cleanly at nexus (50, 52) -->
  <path d="M74 26 L50 52 V67 C50 76.5 43 83 33 83 C24 83 18 76.5 18 69" stroke="url(#yjFavGradJ)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Precision Accent Nodes -->
  <circle cx="26" cy="26" r="3.2" fill="#b8a8ff" />
  <circle cx="74" cy="26" r="3.2" fill="#8cd8ff" />
  <circle cx="18" cy="69" r="3.2" fill="#78e6bc" />
  <circle cx="50" cy="52" r="2" fill="#ffffff" opacity="0.85" />
</svg>
